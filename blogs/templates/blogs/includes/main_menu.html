<div class="collapse text-bg-dark" id="navbarHeader">
    <div class="container">
        <div class="row">
            <div class="col-sm-8 col-md-7 py-4">
                <h4>Начни и ты вести свой блог</h4>
                <p class="text-body-secondary">Расскажи о самом интересном</p>
                <p class="text-body-secondary">Будь в тренде с нами</p>
            </div>
            <div class="col-sm-4 offset-md-1 py-4"><h4>Навигация</h4>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white">Главная</a></li>
                    {% if user.is_authenticated %}
                    <li class="mt-2">
                        <div class="p-2 btn btn-outline-primary dropdown">
                            <p class="dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                {{ user.email }}
                            </p>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="{% url 'users:detail' %}">Профиль</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li>
                                    <form method="post" action="{% url 'users:logout' %}" style="display: inline">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item btn-outline-primary">Выйти</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </li>
                    {% else %}
                    <li><a href="{% url 'users:login' %}" class="text-white">Вход</a></li>
                    <li><a href="{% url 'users:register' %}" class="text-white">Регистрация</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </div>
</div>
<div class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container"><a href="#" class="navbar-brand d-flex align-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" class="me-2"
             viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <strong>Ваш Блог</strong> </a>
        <button
                class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarHeader"
                aria-controls="navbarHeader" aria-expanded="false" aria-label="Toggle navigation">
            <span
                    class="navbar-toggler-icon">
            </span>
        </button>

        <a href="{% url 'catalog:home' %}" class="btn btn-primary">SkyStore</a></li>
    </div>
</div>
