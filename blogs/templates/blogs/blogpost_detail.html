{% extends "blogs/base_blog.html" %}
{% load blog_tags %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ object.image|media_filter }}">
                <div class="card-body">
                    <p class="card-text">{{ object.title }}</p>
                    <p class="card-text">{{ object.content }}</p>
                    <p class="card-text">Дата публикации: {{ object.created_at }}</p>
                    <p class="card-text">Количество просмотров: {{ object.views_count }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-primary" href="{% url 'blogs:blog_list' %}" role="button">
                                Назад
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
